<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>因数分解 学習管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>因数分解 学習管理アプリ</h1><span id="connection">Firebase未接続</span></header>
<nav>
<button data-tab="teacher">先生</button><button data-tab="student">生徒</button><button data-tab="dashboard">成績</button>
</nav>

<main>
<section id="teacher" class="tab active">
<h2>先生画面</h2>
<div class="grid">
<div class="card">
<label>問題セット名<input id="setName" value="因数分解 基礎"></label>
<label>問題数<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
<label>難易度<select id="difficulty"><option value="easy">基礎</option><option value="mid" selected>標準</option><option value="mixed">混合</option></select></label>
<div class="row"><button id="generate">自動作成</button><button id="saveSet">保存</button><button id="publish">配信</button></div>
</div>
<div class="card">
<h3>保存済み問題セット</h3>
<div id="savedSets">まだありません</div>
</div>
</div>
<div class="card">
<h3>問題編集</h3>
<p class="hint">1行に「問題 | 正解」。例：x² + 5x + 6 | (x+2)(x+3)</p>
<textarea id="manual" rows="7"></textarea>
<button id="applyManual">入力内容を問題セットにする</button>
<div id="questionList"></div>
</div>
</section>

<section id="student" class="tab">
<h2>生徒画面</h2>
<div class="card">
<label>生徒名<input id="studentName" value="生徒A"></label>
<div class="progress"><span id="progress">問題 0 / 0</span><span id="score">正解 0</span></div>
<div id="problem" class="problem">先生が問題を配信すると、ここに表示されます。</div>
<canvas id="pad" width="1000" height="500"></canvas>
<div class="row"><button id="undo">1画戻す</button><button id="clear">消す</button><button id="grade">判定</button></div>
<label>認識結果（確認・修正可）<input id="recognized" placeholder="例：(x+2)(x+3)"></label>
<div id="feedback" class="feedback"></div>
</div>
</section>

<section id="dashboard" class="tab">
<h2>成績・途中式</h2>
<div class="card">
<button id="refresh">更新</button>
<table><thead><tr><th>生徒</th><th>問題</th><th>結果</th><th>途中式</th><th>日時</th></tr></thead><tbody id="results"></tbody></table>
</div>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
